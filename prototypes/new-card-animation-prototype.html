<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipEase 新卡片动画原型</title>
  <style>
    :root {
      --window-bg: rgb(199 209 235);
      --accent: rgb(46 140 255);
      --accent-strong: rgb(13 102 214);
      --ink: rgb(24 31 42);
      --muted: rgb(86 96 113);
      --line: rgb(155 168 199);
      --surface: rgb(255 255 255);
      --shadow: 0 18px 38px rgb(49 63 91 / 22%);
      --card-w: 250px;
      --gap: 18px;
      --push-sheen-duration: 1000ms;
      --ease-out-quint: cubic-bezier(.22, 1, .36, 1);
      --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 24% 12%, rgb(255 255 255 / 55%), transparent 32%),
        linear-gradient(135deg, rgb(231 237 250), rgb(188 200 229));
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .intro {
      margin: 0;
      max-width: 68ch;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .button {
      height: 32px;
      border: 1px solid rgb(84 101 133 / 38%);
      border-radius: 7px;
      padding: 0 11px;
      color: rgb(32 42 58);
      background: rgb(255 255 255 / 68%);
      cursor: pointer;
      transition: background 140ms var(--ease-out-quint), border-color 140ms var(--ease-out-quint), transform 120ms var(--ease-out-quint);
    }

    .button:hover {
      background: rgb(255 255 255 / 92%);
      border-color: rgb(68 91 132 / 48%);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      color: white;
      border-color: var(--accent-strong);
      background: var(--accent);
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button[aria-pressed="true"] {
      color: white;
      border-color: var(--accent-strong);
      background: rgb(25 112 227);
    }

    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgb(95 111 144 / 26%);
      border-radius: 8px;
      background: rgb(255 255 255 / 58%);
      box-shadow: 0 12px 26px rgb(69 83 115 / 12%);
    }

    .side {
      padding: 12px;
    }

    .side-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .option-list {
      display: grid;
      gap: 8px;
    }

    .option {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgb(88 104 133 / 30%);
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      color: var(--ink);
      background: rgb(255 255 255 / 62%);
      cursor: pointer;
    }

    .option:hover {
      background: rgb(255 255 255 / 86%);
    }

    .option[aria-pressed="true"] {
      border-color: rgb(46 140 255 / 82%);
      background: rgb(234 243 255);
      box-shadow: inset 0 0 0 1px rgb(46 140 255 / 22%);
    }

    .option-name {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
      font-weight: 700;
    }

    .option-desc {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .stage-wrap {
      overflow: hidden;
      border-radius: 8px;
      background: var(--window-bg);
      box-shadow: var(--shadow);
    }

    .stage {
      position: relative;
      min-height: 360px;
      padding: 18px 0 22px 18px;
      transform: translateY(0);
    }

    .stage.opening {
      animation: window-slide 140ms linear both;
    }

    .mock-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      margin: 0 18px 14px 0;
    }

    .traffic {
      display: flex;
      gap: 7px;
      margin-right: 4px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgb(255 255 255 / 60%);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      border-radius: 7px;
      padding: 0 10px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      background: rgb(43 60 90 / 62%);
    }

    .status {
      color: rgb(35 47 70);
      font-size: 13px;
      font-weight: 650;
    }

    .rail-viewport {
      position: relative;
      overflow: hidden;
      height: 300px;
    }

    .rail {
      position: absolute;
      inset: 0 auto auto 0;
      display: flex;
      gap: var(--gap);
      align-items: flex-start;
      padding: 14px 18px 12px 8px;
      transition: transform 280ms cubic-bezier(.2, .82, .2, 1);
      will-change: transform;
    }

    .card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: 270px;
      overflow: visible;
      border-radius: 8px;
      background: var(--surface);
      box-shadow:
        0 1px 0 rgb(0 0 0 / 7%),
        inset 0 0 0 1px rgb(0 0 0 / 7%);
      transform-origin: center;
    }

    .card.is-selected {
      box-shadow:
        0 1px 0 rgb(0 0 0 / 7%),
        0 0 0 3px var(--accent),
        inset 0 0 0 1px rgb(255 255 255 / 55%);
      z-index: 3;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      min-height: 58px;
      padding: 8px 16px;
      color: white;
      background: var(--header, rgb(10 132 255));
      border-radius: 8px 8px 0 0;
    }

    .kind {
      display: block;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
    }

    .time {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      font-weight: 600;
      opacity: .94;
    }

    .app-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: rgb(32 42 58);
      font-size: 15px;
      font-weight: 800;
      background: white;
    }

    .preview {
      display: flex;
      height: 164px;
      padding: 14px 16px;
      color: rgb(35 41 53);
      font-size: 14px;
      line-height: 1.42;
      background: white;
    }

    .preview.image {
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgb(238 246 255), rgb(255 244 234)),
        white;
    }

    .swatch {
      width: 108px;
      height: 92px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgb(46 140 255), rgb(0 196 172));
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 42%);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      border-top: 1px solid rgb(0 0 0 / 7%);
      padding: 0 14px;
      color: rgb(75 84 100);
      font-size: 12px;
      font-weight: 650;
      background: rgb(249 250 253);
      border-radius: 0 0 8px 8px;
    }

    .badge {
      border-radius: 6px;
      padding: 4px 7px;
      color: white;
      background: rgb(0 0 0 / 62%);
    }

    .card.enter-current {
      animation: current-enter 300ms var(--ease-out-quint) both;
    }

    .card.enter-inset {
      animation: inset-enter 420ms var(--ease-out-expo) both;
    }

    .card.enter-push {
      animation: push-enter 680ms var(--ease-out-expo) both;
      transform-origin: left center;
    }

    .card.enter-drop {
      animation: drop-enter 460ms var(--ease-out-expo) both;
    }

    .card.enter-push::before {
      content: "";
      position: absolute;
      inset: -4px;
      pointer-events: none;
      border-radius: 12px;
      animation: push-outer-ring 680ms var(--ease-out-expo) both;
      border: 3px solid rgb(46 140 255 / 0);
      z-index: 4;
    }

    .card.enter-push::after,
    .card.enter-inset::before,
    .card.enter-inset::after,
    .card.enter-pulse::after,
    .card.enter-drop::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
    }

    .card.enter-inset::before {
      animation: inset-top-light 420ms var(--ease-out-expo) both;
      height: 74px;
      background: linear-gradient(180deg, rgb(255 255 255 / 58%), rgb(255 255 255 / 0));
      mix-blend-mode: screen;
    }

    .card.enter-inset::after {
      animation: inset-border 420ms var(--ease-out-expo) both;
      box-shadow:
        inset 0 0 0 0 rgb(46 140 255 / 0),
        inset 0 0 0 0 rgb(255 255 255 / 0);
    }

    .card.enter-push::after {
      animation: push-sheen var(--push-sheen-duration) var(--ease-out-expo) both;
      background: linear-gradient(100deg, transparent 0%, rgb(255 255 255 / 0) 34%, rgb(255 255 255 / 52%) 48%, rgb(255 255 255 / 0) 62%, transparent 100%);
      background-size: 260% 100%;
      background-position: 135% 0;
      z-index: 2;
    }

    .card.enter-push .new-label,
    .card.enter-inset .new-label,
    .card.enter-drop .new-label {
      animation: label-pop 980ms var(--ease-out-expo) both;
    }

    .card.enter-pulse::after {
      animation: pulse-ring 520ms var(--ease-out-expo) both;
      box-shadow: 0 0 0 0 rgb(46 140 255 / 45%);
    }

    .card.enter-drop::after {
      animation: drop-flash 460ms var(--ease-out-expo) both;
      box-shadow: inset 0 0 0 4px rgb(46 140 255 / 0);
    }

    .new-label {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      height: 24px;
      border-radius: 6px;
      padding: 0 8px;
      color: white;
      font-size: 11px;
      font-weight: 800;
      background: rgb(46 140 255 / 92%);
      box-shadow: 0 6px 14px rgb(46 140 255 / 30%);
      z-index: 5;
    }

    .card.enter-push .new-label,
    .card.enter-inset .new-label,
    .card.enter-drop .new-label {
      display: inline-flex;
    }

    .clipboard-chip {
      position: absolute;
      top: 14px;
      left: 310px;
      display: none;
      align-items: center;
      gap: 7px;
      height: 30px;
      border-radius: 8px;
      padding: 0 11px;
      color: white;
      font-size: 12px;
      font-weight: 750;
      background: rgb(31 42 62 / 84%);
      box-shadow: 0 10px 22px rgb(38 47 70 / 24%);
      z-index: 8;
    }

    .clipboard-chip.show {
      display: inline-flex;
      animation: clipboard-chip 460ms var(--ease-out-expo) both;
    }

    .notes {
      margin-top: 14px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      color: rgb(45 55 73);
    }

    .notes strong {
      color: rgb(23 31 44);
    }

    .speed-control {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgb(85 101 132 / 18%);
    }

    .speed-control.is-visible {
      display: flex;
    }

    .speed-control label {
      flex: 0 0 auto;
      color: rgb(45 55 73);
      font-size: 12px;
      font-weight: 750;
    }

    .speed-control input[type="range"] {
      flex: 1 1 auto;
      min-width: 180px;
      accent-color: var(--accent);
    }

    .speed-value {
      flex: 0 0 52px;
      color: rgb(23 31 44);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    @keyframes window-slide {
      from {
        transform: translateY(360px);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes current-enter {
      0% {
        opacity: 0;
        transform: translateY(-10px) scale(.96);
      }
      58% {
        opacity: 1;
        transform: translateY(-10px) scale(1.025);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.025);
      }
    }

    @keyframes pulse-enter {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.9);
        filter: saturate(.9);
      }
      36% {
        opacity: 1;
        transform: translateY(-8px) scale(1.065);
        filter: saturate(1.12);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.025);
        filter: saturate(1);
      }
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgb(46 140 255 / 45%);
      }
      100% {
        box-shadow: 0 0 0 18px rgb(46 140 255 / 0%);
      }
    }

    @keyframes inset-enter {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(.975);
        filter: saturate(.96);
      }
      48% {
        opacity: 1;
        transform: translateY(0) scale(1.034);
        filter: saturate(1.08);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.018);
        filter: saturate(1);
      }
    }

    @keyframes inset-top-light {
      0% {
        opacity: 0;
        transform: translateY(-16px);
      }
      42% {
        opacity: .85;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(0);
      }
    }

    @keyframes inset-border {
      0% {
        box-shadow:
          inset 0 0 0 0 rgb(46 140 255 / 0),
          inset 0 0 0 0 rgb(255 255 255 / 0);
      }
      38% {
        box-shadow:
          inset 0 0 0 4px rgb(46 140 255 / 74%),
          inset 0 0 0 6px rgb(255 255 255 / 65%);
      }
      100% {
        box-shadow:
          inset 0 0 0 0 rgb(46 140 255 / 0),
          inset 0 0 0 0 rgb(255 255 255 / 0);
      }
    }

    @keyframes push-enter {
      0% {
        opacity: 0;
        transform: translateX(0) scale(.982);
      }
      58% {
        opacity: 1;
        transform: translateX(0) scale(1.022);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1.012);
      }
    }

    @keyframes push-outer-ring {
      0% {
        opacity: 0;
        border-color: rgb(46 140 255 / 0);
        transform: scale(.985);
      }
      28% {
        opacity: 1;
        border-color: rgb(46 140 255 / 88%);
        transform: scale(1);
      }
      72% {
        opacity: 1;
        border-color: rgb(46 140 255 / 72%);
        transform: scale(1);
      }
      100% {
        opacity: 0;
        border-color: rgb(46 140 255 / 0);
        transform: scale(1.006);
      }
    }

    @keyframes push-sheen {
      0% {
        opacity: 0;
        background-position: 135% 0;
      }
      18% {
        opacity: 1;
      }
      82% {
        opacity: 1;
        background-position: -35% 0;
      }
      100% {
        opacity: 0;
        background-position: -35% 0;
      }
    }

    @keyframes label-pop {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(.86);
      }
      34% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      72% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(0) scale(.98);
      }
    }

    @keyframes drop-enter {
      0% {
        opacity: 0;
        transform: translateY(-42px) scale(.92);
      }
      42% {
        opacity: 1;
        transform: translateY(8px) scale(1.055);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.025);
      }
    }

    @keyframes drop-flash {
      0% {
        box-shadow: inset 0 0 0 4px rgb(46 140 255 / 0);
      }
      42% {
        box-shadow: inset 0 0 0 4px rgb(46 140 255 / 64%);
      }
      100% {
        box-shadow: inset 0 0 0 4px rgb(46 140 255 / 0);
      }
    }

    @keyframes clipboard-chip {
      0% {
        opacity: 0;
        transform: translateY(-6px) scale(.96);
      }
      28% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(70px) scale(.86);
      }
    }

    @media (max-width: 820px) {
      .topbar {
        display: block;
      }

      .toolbar {
        justify-content: flex-start;
        margin-top: 14px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        order: 2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>ClipEase 新卡片动画原型</h1>
        <p class="intro">用于比较“新增剪贴板后主窗口立即打开”时，新卡片如何更明显地被看见。左侧选择方案，右上按钮反复触发。</p>
      </div>
      <div class="toolbar" aria-label="测试操作">
        <button class="button" id="resetBtn" type="button">重置</button>
        <button class="button" id="addBtn" type="button">新增卡片</button>
        <button class="button primary" id="openAddBtn" type="button">窗口打开 + 新增</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel side" aria-label="动画方案">
        <p class="side-title">动画方案</p>
      <div class="option-list">
          <button class="option" type="button" data-mode="current" aria-pressed="true">
            <span class="option-name">A 现状近似</span>
            <span class="option-desc">淡入、轻微放大、上移回落。</span>
          </button>
          <button class="option" type="button" data-mode="inset" aria-pressed="false">
            <span class="option-name">B 内部聚焦</span>
            <span class="option-desc">内部蓝色描边 + 顶部光带，不卡边。</span>
          </button>
          <button class="option" type="button" data-mode="push" aria-pressed="false">
            <span class="option-name">C 稳定推入</span>
            <span class="option-desc">缓慢让位 + 内部高光，流畅稳。</span>
          </button>
          <button class="option" type="button" data-mode="drop" aria-pressed="false">
            <span class="option-name">D 剪贴板落入</span>
            <span class="option-desc">从上方落入 + 蓝色内描边闪一下。</span>
          </button>
          <button class="option" type="button" data-mode="pulse" aria-pressed="false">
            <span class="option-name">风险对照：外扩光环</span>
            <span class="option-desc">会被视口裁剪，不建议直接落地。</span>
          </button>
        </div>
      </aside>

      <div>
        <section class="stage-wrap" aria-label="主窗口预览">
          <div class="stage" id="stage">
            <div class="clipboard-chip" id="clipboardChip">⌘ 新剪贴板</div>
            <div class="mock-toolbar">
              <div class="traffic" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
              <span class="pill">全部</span>
              <span class="pill">置顶</span>
              <span class="status" id="statusText">当前方案：A 现状近似</span>
            </div>
            <div class="rail-viewport">
              <div class="rail" id="rail"></div>
            </div>
          </div>
        </section>

        <section class="panel notes" aria-live="polite">
          <strong id="modeTitle">A 现状近似</strong>
          <span id="modeNote">适合作为对照。突出程度不够强，窗口滑入时容易被整体运动吞掉。</span>
          <div class="speed-control" id="speedControl">
            <label for="sheenSpeed">内部高光速度</label>
            <input id="sheenSpeed" type="range" min="800" max="3000" step="100" value="1000">
            <span class="speed-value" id="sheenSpeedValue">1.0s</span>
          </div>
        </section>
      </div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <span class="new-label">NEW</span>
      <div class="card-header">
        <div>
          <span class="kind"></span>
          <span class="time"></span>
        </div>
        <span class="app-icon"></span>
      </div>
      <div class="preview"></div>
      <div class="footer">
        <span class="source"></span>
        <span class="badge"></span>
      </div>
    </article>
  </template>

  <script>
    const modes = {
      current: {
        label: 'A 现状近似',
        className: 'enter-current',
        note: '适合作为对照。突出程度不够强，窗口滑入时容易被整体运动吞掉。'
      },
      inset: {
        label: 'B 内部聚焦',
        className: 'enter-inset',
        note: '推荐候选。所有提示都在卡片内部完成：轻缩放、内部蓝色描边、顶部光带，不会被 ScrollView 或卡片裁剪。'
      },
      push: {
        label: 'C 稳定推入',
        className: 'enter-push',
        note: '推荐候选。新卡片不再越界，只做轻微缩放和内部高光；节奏放慢后更像“旧卡片让位，新卡片稳定进入”。'
      },
      pulse: {
        label: '风险对照：外扩光环',
        className: 'enter-pulse',
        note: '不建议落地。外扩光环和较大缩放在原型里会被 overflow 裁剪，在 SwiftUI ScrollView 中也有同类风险。'
      },
      drop: {
        label: 'D 剪贴板落入',
        className: 'enter-drop',
        note: '可选候选。语义直接，但纵向位移要控制在很小范围，否则真实应用 300pt 轨道高度里也容易显得顶边紧。'
      }
    };

    const seedCards = [
      {
        kind: '文本',
        time: '刚刚',
        app: 'S',
        source: 'Safari',
        badge: '⌘1',
        header: 'rgb(10 132 255)',
        text: '复制的新内容会被插入到最左侧，并获得焦点描边。'
      },
      {
        kind: '链接',
        time: '1 分钟前',
        app: 'N',
        source: 'Notion',
        badge: '⌘2',
        header: 'rgb(0 184 166)',
        text: 'https://example.com/release-notes'
      },
      {
        kind: '图片',
        time: '4 分钟前',
        app: 'P',
        source: 'Preview',
        badge: '⌘3',
        header: 'rgb(242 91 88)',
        image: true
      },
      {
        kind: '文件',
        time: '8 分钟前',
        app: 'F',
        source: 'Finder',
        badge: '⌘4',
        header: 'rgb(86 116 224)',
        text: 'ClipEase-2.4.0.dmg'
      }
    ];

    const sampleTexts = [
      '新复制的会议纪要：动画应该让第一张卡片立刻被看见。',
      'Release note: improve latest clipboard card entrance.',
      'SwiftUI transition: scale + opacity + focused outline.',
      '用户希望新卡片更突出，但不要变成干扰。'
    ];

    const rail = document.querySelector('#rail');
    const stage = document.querySelector('#stage');
    const template = document.querySelector('#cardTemplate');
    const statusText = document.querySelector('#statusText');
    const modeTitle = document.querySelector('#modeTitle');
    const modeNote = document.querySelector('#modeNote');
    const speedControl = document.querySelector('#speedControl');
    const sheenSpeed = document.querySelector('#sheenSpeed');
    const sheenSpeedValue = document.querySelector('#sheenSpeedValue');
    const clipboardChip = document.querySelector('#clipboardChip');
    const optionButtons = [...document.querySelectorAll('.option')];
    let currentMode = 'current';
    let counter = 0;
    let speedPreviewTimer = 0;

    function makeCard(data, selected = false) {
      const card = template.content.firstElementChild.cloneNode(true);
      card.style.setProperty('--header', data.header);
      card.querySelector('.kind').textContent = data.kind;
      card.querySelector('.time').textContent = data.time;
      card.querySelector('.app-icon').textContent = data.app;
      card.querySelector('.source').textContent = data.source;
      card.querySelector('.badge').textContent = data.badge;
      const preview = card.querySelector('.preview');
      if (data.image) {
        preview.classList.add('image');
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        preview.append(swatch);
      } else {
        preview.textContent = data.text;
      }
      if (selected) card.classList.add('is-selected');
      return card;
    }

    function renderInitial() {
      rail.innerHTML = '';
      seedCards.forEach((data, index) => {
        rail.append(makeCard(data, index === 0));
      });
    }

    function setMode(mode) {
      currentMode = mode;
      optionButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
      statusText.textContent = `当前方案：${modes[mode].label}`;
      modeTitle.textContent = modes[mode].label;
      modeNote.textContent = modes[mode].note;
      speedControl.classList.toggle('is-visible', mode === 'push');
    }

    function updateSheenSpeed(value, { preview = false } = {}) {
      const duration = Number(value);
      document.documentElement.style.setProperty('--push-sheen-duration', `${duration}ms`);
      sheenSpeedValue.textContent = `${(duration / 1000).toFixed(1)}s`;
      if (preview) {
        window.clearTimeout(speedPreviewTimer);
        speedPreviewTimer = window.setTimeout(() => {
          setMode('push');
          addCard();
        }, 180);
      }
    }

    function addCard({ openWindow = false } = {}) {
      counter += 1;
      [...rail.children].forEach((card, index) => {
        card.classList.remove('is-selected');
        const badge = card.querySelector('.badge');
        badge.textContent = `⌘${Math.min(index + 2, 9)}`;
      });

      const data = {
        kind: counter % 3 === 0 ? '链接' : '文本',
        time: '刚刚',
        app: counter % 2 === 0 ? 'C' : 'S',
        source: counter % 2 === 0 ? 'Chrome' : 'Safari',
        badge: '⌘1',
        header: counter % 3 === 0 ? 'rgb(0 184 166)' : 'rgb(10 132 255)',
        text: sampleTexts[counter % sampleTexts.length]
      };

      const card = makeCard(data, true);
      const className = modes[currentMode].className;
      card.classList.add(className);
      rail.prepend(card);

      if (rail.children.length > 7) {
        rail.lastElementChild.remove();
      }

      card.addEventListener('animationend', () => {
        card.classList.remove(className);
      }, { once: true });

      if (openWindow) {
        stage.classList.remove('opening');
        void stage.offsetWidth;
        stage.classList.add('opening');
        window.setTimeout(() => stage.classList.remove('opening'), 170);
      }

      if (currentMode === 'drop' || openWindow) {
        clipboardChip.classList.remove('show');
        void clipboardChip.offsetWidth;
        clipboardChip.classList.add('show');
        window.setTimeout(() => clipboardChip.classList.remove('show'), 480);
      }
    }

    optionButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setMode(button.dataset.mode);
        addCard();
      });
    });

    document.querySelector('#addBtn').addEventListener('click', () => addCard());
    document.querySelector('#openAddBtn').addEventListener('click', () => addCard({ openWindow: true }));
    document.querySelector('#resetBtn').addEventListener('click', () => {
      counter = 0;
      renderInitial();
    });
    sheenSpeed.addEventListener('input', () => {
      updateSheenSpeed(sheenSpeed.value, { preview: true });
    });

    updateSheenSpeed(sheenSpeed.value);
    renderInitial();
  </script>
</body>
</html>
