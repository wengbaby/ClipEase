<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轻贴 App 图标 15 母版</title>
  <style>
    :root {
      --stage-size: 1024px;
      --source-size: 256px;
      --scale: 4;
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7fbff;
    }

    .stage {
      width: var(--stage-size);
      height: var(--stage-size);
      display: grid;
      place-items: center;
      background: transparent;
    }

    .source {
      width: var(--source-size);
      height: var(--source-size);
      transform: scale(var(--scale));
      transform-origin: center;
    }

    .icon {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 29%;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -16px 32px rgba(17, 103, 216, 0.1),
        0 22px 36px rgba(28, 80, 145, 0.18);
      isolation: isolate;
      background: linear-gradient(145deg, #f5fbff 0%, #95cfff 42%, #1268d9 100%);
    }

    .icon::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.42),
        inset 0 -1px 0 rgba(0, 42, 96, 0.14);
      pointer-events: none;
    }

    .shine {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.08) 34%, transparent 58%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .board {
      position: absolute;
      z-index: 3;
      left: 22%;
      top: 24%;
      width: 56%;
      height: 57%;
      border-radius: 24%;
      background: linear-gradient(180deg, #ffffff 0%, #f2f8ff 100%);
      box-shadow: 0 16px 30px rgba(12, 74, 150, 0.22), inset 0 0 0 1px rgba(23, 117, 225, 0.12);
    }

    .clip {
      position: absolute;
      left: 34%;
      top: 12%;
      width: 32%;
      height: 17%;
      z-index: 5;
      border-radius: 999px 999px 18px 18px;
      background: linear-gradient(180deg, #ffffff 0%, #dbeeff 100%);
      box-shadow: 0 8px 18px rgba(14, 82, 166, 0.16), inset 0 -2px 0 rgba(47, 140, 255, 0.16);
    }

    .clip::before {
      content: "";
      position: absolute;
      left: 25%;
      top: 22%;
      width: 50%;
      height: 42%;
      border-radius: 999px;
      background: rgba(47, 140, 255, 0.22);
      box-shadow: inset 0 1px 2px rgba(17, 103, 216, 0.18);
    }

    .heart {
      position: absolute;
      z-index: 6;
      left: 38%;
      top: 45%;
      width: 24%;
      height: 24%;
      background: #2f8cff;
      transform: rotate(45deg);
      border-radius: 0 0 14% 0;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      left: -50%;
      top: 0;
    }

    .heart::after {
      left: 0;
      top: -50%;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="轻贴 App 图标 15 母版">
    <div class="source">
      <div class="icon" id="app-icon-15">
        <div class="board"></div>
        <div class="clip"></div>
        <div class="heart"></div>
        <div class="shine"></div>
      </div>
    </div>
  </main>
</body>
</html>
